<title>多益字卡箱</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0E9; --paper-raised:#FFFFFF; --card:#FFFFFF;
  --ink:#23262B; --ink-soft:#5B6169; --ink-faint:#8A8F97;
  --line:rgba(35,38,43,.12); --line-strong:rgba(35,38,43,.22);
  --accent:#B8863B; --accent-ink:#2A1F0C; --accent-soft:rgba(184,134,59,.14);
  --mastery:#2F6F63; --mastery-soft:rgba(47,111,99,.13);
  --struggle:#B4502E; --struggle-soft:rgba(180,80,46,.13);
  --shadow: 0 1px 2px rgba(30,25,10,.06), 0 8px 24px -12px rgba(30,25,10,.18);
  --radius: 14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1D22; --paper-raised:#22252B; --card:#24272D;
    --ink:#ECEAE3; --ink-soft:#A8ACB4; --ink-faint:#767B84;
    --line:rgba(236,234,227,.12); --line-strong:rgba(236,234,227,.22);
    --accent:#D9A94F; --accent-ink:#241A08; --accent-soft:rgba(217,169,79,.16);
    --mastery:#4FA593; --mastery-soft:rgba(79,165,147,.16);
    --struggle:#E08561; --struggle-soft:rgba(224,133,97,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#1B1D22; --paper-raised:#22252B; --card:#24272D;
  --ink:#ECEAE3; --ink-soft:#A8ACB4; --ink-faint:#767B84;
  --line:rgba(236,234,227,.12); --line-strong:rgba(236,234,227,.22);
  --accent:#D9A94F; --accent-ink:#241A08; --accent-soft:rgba(217,169,79,.16);
  --mastery:#4FA593; --mastery-soft:rgba(79,165,147,.16);
  --struggle:#E08561; --struggle-soft:rgba(224,133,97,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;}
.display{font-family:"Fraunces","Noto Serif TC",serif;}
h1,h2,h3{text-wrap:balance;}
button{font-family:inherit;}

/* ---------- shell ---------- */
.shell{max-width:920px;margin:0 auto;padding:0 20px 64px;}
.topbar{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:28px 0 18px; border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand-mark{
  font-family:"IBM Plex Mono";font-weight:700;font-size:13px;letter-spacing:.06em;
  background:var(--accent); color:var(--accent-ink); padding:3px 7px; border-radius:5px;
}
.brand h1{font-size:21px;font-weight:600;margin:0;letter-spacing:.01em;}
.brand-sub{font-size:12.5px;color:var(--ink-faint);}

nav.tabs{
  display:flex; gap:4px; margin-top:18px; padding:4px;
  background:var(--paper-raised); border:1px solid var(--line); border-radius:12px;
  overflow-x:auto;
}
nav.tabs button{
  flex:1; white-space:nowrap;
  background:transparent;border:none;color:var(--ink-soft);
  font-size:14px; font-weight:500; padding:9px 14px; border-radius:9px; cursor:pointer;
  transition:background .15s, color .15s;
}
nav.tabs button.active{background:var(--accent); color:var(--accent-ink); font-weight:700;}
nav.tabs button:not(.active):hover{background:var(--accent-soft); color:var(--ink);}

section.view{display:none; padding-top:26px;}
section.view.active{display:block;}

/* ---------- stat strip ---------- */
.statstrip{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; margin-bottom:24px;
}
.stat{background:var(--paper-raised); padding:14px 16px;}
.stat b{display:block; font-family:"IBM Plex Mono"; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums;}
.stat span{font-size:11.5px; color:var(--ink-faint); letter-spacing:.03em;}

/* ---------- flashcard ---------- */
.review-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.review-head h2{font-size:15px; margin:0; color:var(--ink-soft); font-weight:500;}
.iconbtn{
  background:transparent;border:1px solid var(--line); color:var(--ink-soft);
  border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer;
}
.iconbtn:hover{border-color:var(--line-strong); color:var(--ink);}

.stage{display:flex; flex-direction:column; align-items:center; gap:20px;}
.cardwrap{width:100%; max-width:440px; perspective:1400px;}
.flashcard{
  position:relative; height:280px; width:100%;
  cursor:pointer; transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.2,.7,.3,1);
}
.flashcard.flipped{transform:rotateY(180deg);}
.face{
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius:18px; border:1px solid var(--line); background:var(--card);
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px; text-align:center;
}
.face.back{transform:rotateY(180deg);}
.face .idx{position:absolute; top:16px; left:18px; font-size:11px; color:var(--ink-faint); font-family:"IBM Plex Mono";}
.face .lvl{position:absolute; top:16px; right:18px; display:flex; gap:3px;}
.lvl i{width:6px;height:6px;border-radius:50%;background:var(--line-strong);display:block;}
.lvl i.on{background:var(--accent);}
.word{font-family:"IBM Plex Mono"; font-weight:600; font-size:34px; letter-spacing:-.01em; word-break:break-word;}
.pos{margin-top:10px; font-size:12.5px; color:var(--ink-faint); font-style:italic;}
.kk{margin-top:6px; font-family:"IBM Plex Mono", monospace; font-size:15px; color:var(--accent);}
.speak-btn{margin-left:8px; border:none; background:none; cursor:pointer; font-size:16px; line-height:1; vertical-align:middle; padding:2px 4px; border-radius:6px; opacity:.75;}
.speak-btn:hover{opacity:1; background:var(--accent-soft);}
.wordrow .speak-btn{margin-left:2px; font-size:13px;}
.hint{margin-top:22px; font-size:12px; color:var(--ink-faint);}
.def{font-size:23px; font-weight:500; line-height:1.5;}
.chiprow{display:flex; gap:6px; margin-top:16px; flex-wrap:wrap; justify-content:center;}
.chip{
  font-size:11px; padding:3px 9px; border-radius:100px; border:1px solid var(--line-strong);
  color:var(--ink-soft); background:var(--paper-raised);
}
.chip.accentchip{border-color:transparent; background:var(--accent-soft); color:var(--accent); font-weight:600;}

.actions{display:flex; gap:10px; width:100%; max-width:440px;}
.actbtn{
  flex:1; padding:14px 10px; border-radius:12px; border:1px solid var(--line);
  font-size:14.5px; font-weight:700; cursor:pointer; background:var(--paper-raised); color:var(--ink);
  transition:transform .1s, filter .15s;
}
.actbtn:active{transform:scale(.97);}
.actbtn.no{color:var(--struggle); border-color:var(--struggle-soft); background:var(--struggle-soft);}
.actbtn.no:hover{filter:brightness(0.97);}
.actbtn.yes{color:var(--mastery-ink,var(--accent-ink)); background:var(--mastery); border-color:var(--mastery); color:#fff;}
.actbtn.yes:hover{filter:brightness(1.06);}
.actbtn:disabled{opacity:.4; cursor:default;}
.skiprow{font-size:12.5px; color:var(--ink-faint); text-align:center;}
.skiprow button{background:none;border:none;color:var(--ink-faint);text-decoration:underline;cursor:pointer;font-size:inherit;padding:0;}

.empty{
  text-align:center; padding:60px 20px; border:1px dashed var(--line-strong); border-radius:var(--radius);
  color:var(--ink-soft);
}
.empty .display{font-size:20px; color:var(--ink); margin-bottom:8px;}
.empty button{margin-top:18px;}

.primary-btn{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px;
  padding:11px 20px; font-weight:700; font-size:14px; cursor:pointer;
}
.primary-btn:hover{filter:brightness(1.05);}
.ghost-btn{
  background:transparent; color:var(--ink); border:1px solid var(--line-strong); border-radius:10px;
  padding:10px 18px; font-weight:600; font-size:13.5px; cursor:pointer;
}

/* settings popover */
.settings-panel{
  border:1px solid var(--line); background:var(--paper-raised); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:20px; display:none; gap:14px; flex-direction:column;
}
.settings-panel.open{display:flex;}
.settings-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.settings-row label{font-size:13.5px; color:var(--ink-soft);}
.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);cursor:pointer;font-size:15px;}
.stepper b{font-family:"IBM Plex Mono";min-width:26px;text-align:center;font-variant-numeric:tabular-nums;}

/* ---------- category grid ---------- */
.catgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-bottom:24px;}
.catcard{
  border:1px solid var(--line); background:var(--paper-raised); border-radius:12px;
  padding:14px 14px; cursor:pointer; text-align:left; transition:border-color .15s, transform .1s;
}
.catcard:hover{border-color:var(--accent);}
.catcard:active{transform:scale(.98);}
.catcard b{display:block; font-size:14px; margin-bottom:6px;}
.catcard .catcount{font-size:11.5px; color:var(--ink-faint); font-family:"IBM Plex Mono";}
.catcard .bar{height:4px; border-radius:2px; background:var(--line); margin-top:10px; overflow:hidden;}
.catcard .bar i{display:block; height:100%; background:var(--mastery);}

.catpractice-head{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.catpractice-head .backlink{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px;}
.catpractice-head h2{font-size:17px;margin:0;}
.progressline{height:5px;background:var(--line);border-radius:3px;overflow:hidden;width:100%;max-width:440px;margin:0 auto 18px;}
.progressline i{display:block;height:100%;background:var(--accent);transition:width .3s;}

/* ---------- browse ---------- */
.browsebar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.browsebar input[type=text]{
  flex:1; min-width:160px; padding:10px 14px; border-radius:10px; border:1px solid var(--line-strong);
  background:var(--paper-raised); color:var(--ink); font-size:14px;
}
.browsebar select{
  padding:10px 12px; border-radius:10px; border:1px solid var(--line-strong);
  background:var(--paper-raised); color:var(--ink); font-size:13.5px;
}
.wordlist{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.wordrow{
  display:flex; align-items:baseline; gap:12px; padding:11px 16px; border-bottom:1px solid var(--line);
  background:var(--paper-raised);
}
.wordrow:last-child{border-bottom:none;}
.wordrow .w{font-family:"IBM Plex Mono"; font-weight:600; font-size:14.5px; min-width:120px;}
.wordrow .p{font-size:11.5px; color:var(--ink-faint); font-style:italic; min-width:36px;}
.wordrow .k{font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--accent); min-width:90px;}
.wordrow .d{font-size:13.5px; color:var(--ink-soft); flex:1;}
.wordrow .badge{font-size:10.5px; padding:2px 7px; border-radius:100px; background:var(--paper); color:var(--ink-faint); border:1px solid var(--line);}
.loadmore{display:block; margin:16px auto 0;}
.resultcount{font-size:12px; color:var(--ink-faint); margin-bottom:10px;}

/* ---------- stats ---------- */
.levelchart{display:flex; align-items:flex-end; gap:10px; height:150px; padding:14px 6px 0; border-bottom:1px solid var(--line);}
.levelchart .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:8px;}
.levelchart .bar{width:100%; max-width:44px; background:var(--accent-soft); border-radius:6px 6px 0 0; position:relative; min-height:2px;}
.levelchart .bar i{position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:11px; font-family:"IBM Plex Mono"; color:var(--ink-soft);}
.levelchart .lab{font-size:11px; color:var(--ink-faint); margin-top:8px;}
.statgrid2{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-top:22px;}
.catstat{border:1px solid var(--line); background:var(--paper-raised); border-radius:10px; padding:12px 14px;}
.catstat b{font-size:13px; display:block; margin-bottom:8px;}
.catstat .bar{height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
.catstat .bar i{display:block; height:100%; background:var(--mastery);}
.catstat .catstatnum{font-size:11px; color:var(--ink-faint); margin-top:6px; font-family:"IBM Plex Mono";}

footer.note{margin-top:44px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-faint); line-height:1.7;}

@media (max-width:600px){
  .statstrip{grid-template-columns:repeat(2,1fr);}
  .word{font-size:28px;}
  .def{font-size:20px;}
}
</style>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">3000</span>
      <div>
        <h1>多益字卡箱</h1>
        <div class="brand-sub">TOEIC Vocabulary Box · 間隔複習系統</div>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <button data-view="review" class="active">複習</button>
    <button data-view="category">分類練習</button>
    <button data-view="browse">瀏覽全部</button>
    <button data-view="stats">統計</button>
  </nav>

  <!-- ============ REVIEW ============ -->
  <section class="view active" id="view-review">
    <div class="statstrip">
      <div class="stat"><b id="s-due">0</b><span>今日待複習</span></div>
      <div class="stat"><b id="s-unlocked">0</b><span>已解鎖字數</span></div>
      <div class="stat"><b id="s-mastered">0</b><span>已熟記</span></div>
      <div class="stat"><b id="s-total">2931</b><span>單字總數</span></div>
    </div>

    <div class="review-head">
      <h2 id="review-status">準備複習</h2>
      <button class="iconbtn" id="btn-settings">⚙ 設定</button>
    </div>

    <div class="settings-panel" id="settings-panel">
      <div class="settings-row">
        <label>每日新字上限</label>
        <div class="stepper">
          <button id="cap-minus">−</button>
          <b id="cap-val">25</b>
          <button id="cap-plus">+</button>
        </div>
      </div>
      <div class="settings-row">
        <label>已解鎖 <span id="settings-unlocked" class="mono">0</span> / 2931 字</label>
        <button class="ghost-btn" id="btn-unlock-more">今天再多解鎖一批</button>
      </div>
      <div class="settings-row">
        <label style="color:var(--struggle)">清除全部進度（無法復原）</label>
        <button class="ghost-btn" id="btn-reset" style="border-color:var(--struggle-soft);color:var(--struggle)">重置</button>
      </div>
    </div>

    <div class="stage" id="review-stage">
      <!-- filled by JS -->
    </div>
  </section>

  <!-- ============ CATEGORY ============ -->
  <section class="view" id="view-category">
    <div id="category-grid-wrap">
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 16px;">選一個場景分類，只針對這個主題集中複習（不受每日新字上限限制）。</p>
      <div class="catgrid" id="category-grid"></div>
    </div>
    <div id="category-practice-wrap" style="display:none;">
      <div class="catpractice-head">
        <button class="backlink" id="cat-back">← 返回分類</button>
        <h2 id="cat-practice-title"></h2>
      </div>
      <div class="progressline"><i id="cat-progress-bar" style="width:0%"></i></div>
      <div class="stage" id="cat-stage"></div>
    </div>
  </section>

  <!-- ============ BROWSE ============ -->
  <section class="view" id="view-browse">
    <div class="browsebar">
      <input type="text" id="search-input" placeholder="搜尋單字…">
      <select id="filter-cat"></select>
    </div>
    <div class="resultcount" id="result-count"></div>
    <div class="wordlist" id="wordlist"></div>
    <button class="ghost-btn loadmore" id="btn-loadmore" style="display:none;">載入更多</button>
  </section>

  <!-- ============ STATS ============ -->
  <section class="view" id="view-stats">
    <h2 class="display" style="font-size:19px;margin:0 0 4px;">熟悉度分布</h2>
    <p style="color:var(--ink-faint);font-size:12.5px;margin:0 0 6px;">Lv.1 剛學 → Lv.5 已熟記，僅計算已解鎖的字</p>
    <div class="levelchart" id="level-chart"></div>
    <h2 class="display" style="font-size:19px;margin:34px 0 4px;">分類進度</h2>
    <p style="color:var(--ink-faint);font-size:12.5px;margin:0 0 6px;">各場景分類中，已熟記（Lv.5）的比例</p>
    <div class="statgrid2" id="cat-stats"></div>
  </section>

  <footer class="note">
    字義為原創簡短釋義（依常見用法自行撰寫），非逐字引用任何出版品內容；場景分類為自製標籤，僅供複習輔助使用。<br>
    複習進度儲存在此頁面的瀏覽器 localStorage 中，只存在這個分頁／這台裝置，換瀏覽器或清除網站資料會遺失進度。
  </footer>
</div>

const STORE_KEY = "toeic3000_srs_v1";

/* ============ pronunciation (backend /tts, edge-tts neural voice) ============ */
const TTS_API_BASE = "http://localhost:8000"; // change if your backend runs elsewhere
let ttsAudio = null;
function speak(word){
  if(!word) return;
  if(ttsAudio){ ttsAudio.pause(); ttsAudio = null; }
  ttsAudio = new Audio(`${TTS_API_BASE}/tts/${encodeURIComponent(word)}`);
  ttsAudio.play().catch(()=>{
    console.warn("發音服務無法連線，請確認 backend 是否已啟動：" + TTS_API_BASE);
  });
}
const DAY = 86400000;
const INTERVAL = {1:0, 2:1*DAY, 3:3*DAY, 4:7*DAY, 5:14*DAY};

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {cards:{}, unlockedCount:0, dailyCap:25, lastUnlockDate:null, lastActiveDate:null};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
if(!state.cards) state.cards = {};
if(!state.dailyCap) state.dailyCap = 25;
if(typeof state.unlockedCount !== "number") state.unlockedCount = 0;

function todayStr(){ return new Date().toDateString(); }

function ensureUnlocked(){
  const today = todayStr();
  if(state.lastUnlockDate !== today){
    state.unlockedCount = Math.min(CARDS.length, state.unlockedCount + state.dailyCap);
    state.lastUnlockDate = today;
    saveState();
  } else if(state.unlockedCount === 0){
    state.unlockedCount = Math.min(CARDS.length, state.dailyCap);
    saveState();
  }
}
ensureUnlocked();

function cardState(word){
  if(!state.cards[word]) state.cards[word] = {level:0, due:0, seen:false};
  return state.cards[word];
}

function unlockedCards(){ return CARDS.slice(0, state.unlockedCount); }

function isMastered(word){ const s = state.cards[word]; return s && s.level >= 5; }

/* ============ shared flip-card renderer ============ */
function renderFace(card, wasFlipped){
  const cs = cardState(card.w);
  const chips = card.c.map(cc=>`<span class="chip">${CATMETA[cc]||cc}</span>`).join("");
  return `
    <div class="flashcard ${wasFlipped?'flipped':''}" id="flip-el">
      <div class="face front">
        <span class="lvl">${[1,2,3,4,5].map(n=>`<i class="${cs.level>=n?'on':''}"></i>`).join('')}</span>
        <div class="word">${card.w}<button class="speak-btn" type="button" aria-label="發音">🔊</button></div>
        ${card.k ? `<div class="kk">[${card.k}]</div>` : ""}
        <div class="pos">${card.p}</div>
        <div class="hint">點卡片看意思</div>
      </div>
      <div class="face back">
        <div class="def">${card.d}</div>
        <div class="chiprow">${chips}</div>
      </div>
    </div>`;
}

/* ============ REVIEW TAB ============ */
let reviewQueue = [];
let reviewFlipped = false;
let sessionDone = 0;

function buildReviewQueue(){
  const now = Date.now();
  const unlocked = unlockedCards();
  const due = [], fresh = [];
  unlocked.forEach(c=>{
    const cs = cardState(c.w);
    if(!cs.seen) fresh.push(c);
    else if(cs.due <= now) due.push(c);
  });
  due.sort((a,b)=> cardState(a.w).level - cardState(b.w).level);
  // interleave: 2 due-review per 1 fresh word, so new words trickle in
  const q = [];
  let di=0, fi=0;
  while(di<due.length || fi<fresh.length){
    if(di<due.length){ q.push(due[di++]); }
    if(di<due.length){ q.push(due[di++]); }
    if(fi<fresh.length){ q.push(fresh[fi++]); }
  }
  return q;
}

function renderReview(){
  document.getElementById("s-unlocked").textContent = state.unlockedCount;
  document.getElementById("settings-unlocked").textContent = state.unlockedCount;
  document.getElementById("s-total").textContent = CARDS.length;
  const mastered = unlockedCards().filter(c=>isMastered(c.w)).length;
  document.getElementById("s-mastered").textContent = mastered;
  document.getElementById("s-due").textContent = reviewQueue.length;

  const stage = document.getElementById("review-stage");
  if(reviewQueue.length === 0){
    document.getElementById("review-status").textContent = "今日進度";
    const canUnlockMore = state.unlockedCount < CARDS.length;
    stage.innerHTML = `
      <div class="empty" style="width:100%;max-width:440px;">
        <div class="display">今天複習完成了 🎉</div>
        <div>本輪複習了 ${sessionDone} 張字卡</div>
        ${canUnlockMore ? `<button class="primary-btn" id="btn-more-now">再解鎖 ${state.dailyCap} 個新字</button>` : `<div style="margin-top:10px;color:var(--ink-faint);font-size:13px;">已解鎖全部 2931 個字！明天再回來複習吧。</div>`}
      </div>`;
    const btn = document.getElementById("btn-more-now");
    if(btn) btn.onclick = ()=>{
      state.unlockedCount = Math.min(CARDS.length, state.unlockedCount + state.dailyCap);
      saveState();
      reviewQueue = buildReviewQueue();
      renderReview();
    };
    return;
  }
  document.getElementById("review-status").textContent = `本輪還有 ${reviewQueue.length} 張`;
  const card = reviewQueue[0];
  stage.innerHTML = `
    <div class="cardwrap">${renderFace(card, reviewFlipped)}</div>
    <div class="actions">
      <button class="actbtn no" id="btn-no" ${!reviewFlipped?'disabled':''}>還不熟</button>
      <button class="actbtn yes" id="btn-yes" ${!reviewFlipped?'disabled':''}>已經會了</button>
    </div>
    <div class="skiprow"><button id="btn-skip">暫時跳過這張</button></div>
  `;
  stage.querySelector("#flip-el").onclick = ()=>{
    reviewFlipped = !reviewFlipped;
    renderReview();
  };
  stage.querySelector(".speak-btn").onclick = (e)=>{ e.stopPropagation(); speak(card.w); };
  const noBtn = document.getElementById("btn-no");
  const yesBtn = document.getElementById("btn-yes");
  if(noBtn) noBtn.onclick = (e)=>{ e.stopPropagation(); answerCard(card, false); };
  if(yesBtn) yesBtn.onclick = (e)=>{ e.stopPropagation(); answerCard(card, true); };
  document.getElementById("btn-skip").onclick = (e)=>{
    e.stopPropagation();
    reviewQueue.push(reviewQueue.shift());
    reviewFlipped = false;
    renderReview();
  };
}

function answerCard(card, known){
  const cs = cardState(card.w);
  const now = Date.now();
  cs.seen = true;
  if(known){
    cs.level = Math.min(5, (cs.level||0) + 1);
    cs.due = now + (INTERVAL[cs.level] ?? DAY);
  } else {
    cs.level = 1;
    cs.due = now;
    // requeue soon within this session
    reviewQueue.splice(Math.min(reviewQueue.length, 4), 0, card);
  }
  saveState();
  sessionDone++;
  reviewQueue.shift();
  reviewFlipped = false;
  renderReview();
}

/* ============ CATEGORY TAB ============ */
let catPracticeQueue = [];
let catPracticeIdx = 0;
let catPracticeFlipped = false;
let catPracticeTotal = 0;

function renderCategoryGrid(){
  const grid = document.getElementById("category-grid");
  grid.innerHTML = CAT_ORDER.map(code=>{
    const words = CARDS.filter(c=>c.c.includes(code));
    const mastered = words.filter(c=>isMastered(c.w)).length;
    const pct = words.length ? Math.round(mastered/words.length*100) : 0;
    return `<button class="catcard" data-cat="${code}">
      <b>${CATMETA[code]}</b>
      <span class="catcount">${words.length} 字 · ${mastered} 已熟記</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </button>`;
  }).join("");
  grid.querySelectorAll(".catcard").forEach(btn=>{
    btn.onclick = ()=> openCategoryPractice(btn.dataset.cat);
  });
}

function openCategoryPractice(code){
  catPracticeQueue = CARDS.filter(c=>c.c.includes(code));
  catPracticeTotal = catPracticeQueue.length;
  catPracticeIdx = 0;
  catPracticeFlipped = false;
  document.getElementById("cat-practice-title").textContent = CATMETA[code] + `（${catPracticeTotal} 字）`;
  document.getElementById("category-grid-wrap").style.display = "none";
  document.getElementById("category-practice-wrap").style.display = "block";
  renderCatPractice();
}

function renderCatPractice(){
  const stage = document.getElementById("cat-stage");
  const pct = catPracticeTotal ? Math.round(catPracticeIdx/catPracticeTotal*100) : 0;
  document.getElementById("cat-progress-bar").style.width = pct + "%";
  if(catPracticeIdx >= catPracticeQueue.length){
    stage.innerHTML = `<div class="empty" style="width:100%;max-width:440px;">
      <div class="display">這個分類複習完了 ✓</div>
      <button class="primary-btn" id="btn-cat-restart">再複習一次</button>
    </div>`;
    document.getElementById("btn-cat-restart").onclick = ()=>{ catPracticeIdx=0; catPracticeFlipped=false; renderCatPractice(); };
    return;
  }
  const card = catPracticeQueue[catPracticeIdx];
  stage.innerHTML = `
    <div class="cardwrap">${renderFace(card, catPracticeFlipped)}</div>
    <div class="actions">
      <button class="actbtn no" id="cp-no" ${!catPracticeFlipped?'disabled':''}>還不熟</button>
      <button class="actbtn yes" id="cp-yes" ${!catPracticeFlipped?'disabled':''}>已經會了</button>
    </div>
  `;
  stage.querySelector("#flip-el").onclick = ()=>{ catPracticeFlipped=!catPracticeFlipped; renderCatPractice(); };
  stage.querySelector(".speak-btn").onclick = (e)=>{ e.stopPropagation(); speak(card.w); };
  document.getElementById("cp-no").onclick = (e)=>{ e.stopPropagation(); cpAnswer(card,false); };
  document.getElementById("cp-yes").onclick = (e)=>{ e.stopPropagation(); cpAnswer(card,true); };
}
function cpAnswer(card, known){
  const cs = cardState(card.w);
  cs.seen = true;
  const now = Date.now();
  if(known){ cs.level = Math.min(5,(cs.level||0)+1); cs.due = now + (INTERVAL[cs.level]??DAY); }
  else { cs.level = 1; cs.due = now; }
  saveState();
  catPracticeIdx++;
  catPracticeFlipped = false;
  renderCatPractice();
}
document.getElementById("cat-back").onclick = ()=>{
  document.getElementById("category-practice-wrap").style.display = "none";
  document.getElementById("category-grid-wrap").style.display = "block";
  renderCategoryGrid();
};

/* ============ BROWSE TAB ============ */
let browseShown = 50;
function renderBrowse(){
  const q = document.getElementById("search-input").value.trim().toLowerCase();
  const cat = document.getElementById("filter-cat").value;
  let results = CARDS;
  if(cat) results = results.filter(c=>c.c.includes(cat));
  if(q) results = results.filter(c=>c.w.includes(q) || c.d.includes(q));
  document.getElementById("result-count").textContent = `共 ${results.length} 個字`;
  const shown = results.slice(0, browseShown);
  document.getElementById("wordlist").innerHTML = shown.map(c=>`
    <div class="wordrow">
      <span class="w">${c.w}</span>
      <button class="speak-btn" type="button" data-word="${c.w}" aria-label="發音">🔊</button>
      <span class="k">${c.k ? `[${c.k}]` : ""}</span>
      <span class="p">${c.p}</span>
      <span class="d">${c.d}</span>
      <span class="badge">${CATMETA[c.c[0]]||''}</span>
    </div>`).join("") || `<div style="padding:24px;color:var(--ink-faint);text-align:center;">找不到符合的字</div>`;
  document.getElementById("btn-loadmore").style.display = results.length > browseShown ? "block" : "none";
}
document.getElementById("wordlist").addEventListener("click", (e)=>{
  const btn = e.target.closest(".speak-btn");
  if(btn) speak(btn.dataset.word);
});
document.getElementById("search-input").addEventListener("input", ()=>{ browseShown=50; renderBrowse(); });
document.getElementById("filter-cat").addEventListener("change", ()=>{ browseShown=50; renderBrowse(); });
document.getElementById("btn-loadmore").onclick = ()=>{ browseShown += 100; renderBrowse(); };

function initCatFilter(){
  const sel = document.getElementById("filter-cat");
  sel.innerHTML = `<option value="">所有分類</option>` + CAT_ORDER.map(c=>`<option value="${c}">${CATMETA[c]}</option>`).join("");
}

/* ============ STATS TAB ============ */
function renderStats(){
  const unlocked = unlockedCards();
  const counts = [0,0,0,0,0,0];
  unlocked.forEach(c=>{ const lv = cardState(c.w).level||0; counts[lv]++; });
  const labels = ["未開始","Lv.1","Lv.2","Lv.3","Lv.4","Lv.5"];
  const max = Math.max(1,...counts);
  document.getElementById("level-chart").innerHTML = counts.map((n,i)=>`
    <div class="col">
      <div class="bar" style="height:${Math.max(2,n/max*100)}%"><i>${n}</i></div>
      <div class="lab">${labels[i]}</div>
    </div>`).join("");

  document.getElementById("cat-stats").innerHTML = CAT_ORDER.map(code=>{
    const words = CARDS.filter(c=>c.c.includes(code));
    const mastered = words.filter(c=>isMastered(c.w)).length;
    const pct = words.length ? Math.round(mastered/words.length*100) : 0;
    return `<div class="catstat">
      <b>${CATMETA[code]}</b>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="catstatnum">${mastered} / ${words.length}</div>
    </div>`;
  }).join("");
}

/* ============ nav & settings ============ */
document.querySelectorAll("nav.tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll("section.view").forEach(v=>v.classList.remove("active"));
    document.getElementById("view-"+btn.dataset.view).classList.add("active");
    if(btn.dataset.view === "category") renderCategoryGrid();
    if(btn.dataset.view === "browse") renderBrowse();
    if(btn.dataset.view === "stats") renderStats();
  });
});

document.getElementById("btn-settings").onclick = ()=>{
  document.getElementById("settings-panel").classList.toggle("open");
};
document.getElementById("cap-minus").onclick = ()=>{
  state.dailyCap = Math.max(5, state.dailyCap - 5); saveState();
  document.getElementById("cap-val").textContent = state.dailyCap;
};
document.getElementById("cap-plus").onclick = ()=>{
  state.dailyCap = Math.min(100, state.dailyCap + 5); saveState();
  document.getElementById("cap-val").textContent = state.dailyCap;
};
document.getElementById("btn-unlock-more").onclick = ()=>{
  state.unlockedCount = Math.min(CARDS.length, state.unlockedCount + state.dailyCap);
  saveState();
  reviewQueue = buildReviewQueue();
  renderReview();
};
document.getElementById("btn-reset").onclick = ()=>{
  if(confirm("確定要清除所有複習進度嗎？此動作無法復原。")){
    localStorage.removeItem(STORE_KEY);
    state = loadState();
    ensureUnlocked();
    reviewQueue = buildReviewQueue();
    sessionDone = 0;
    document.getElementById("cap-val").textContent = state.dailyCap;
    renderReview();
  }
};

/* ============ init ============ */
document.getElementById("cap-val").textContent = state.dailyCap;
initCatFilter();
reviewQueue = buildReviewQueue();
renderReview();
</script>
